<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ 'Create account' if mode == 'register' else 'Log in' }}</title></head>
<body><h1>{{ 'Create account' if mode == 'register' else 'Log in' }}</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><p><label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="username" required></p><p><label for="password">Password</label><input id="password" name="password" type="password" maxlength="128" {% if mode == 'register' %}minlength="12" autocomplete="new-password"{% else %}autocomplete="current-password"{% endif %} required></p><button>{{ 'Create account' if mode == 'register' else 'Log in' }}</button></form><p><a href="{{ url_for('shop.index') }}">Back to catalog</a></p></body></html>
